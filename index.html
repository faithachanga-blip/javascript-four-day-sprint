
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Focus Board</h1>
  </header>
  <main>
    <form id="task-form" novalidate>
      <label for="title">New task</label>
      <input id="title" name="title" type="text">
      <label for="priority">Priority</label>
      <select id="priority" name="priority">
        <option value="low">low</option>
        <option value="medium" selected>medium</option>
        <option value="high">high</option>
      </select>
      <button type="submit">Add</button>
      <p id="form-error" aria-live="polite"></p>
    </form>

    <label for="search">Search tasks</label>
    <input id="search" type="search">

    <div id="filters">
      <button type="button" data-status="all">All</button>
      <button type="button" data-status="open">Open</button>
      <button type="button" data-status="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>
    <p id="status" aria-live="polite"></p>

    <section>
      <h2>Suggestions</h2>
      <button type="button" id="load-suggestions">Load suggestions</button>
      <p id="suggestions-status" aria-live="polite"></p>
      <ul id="suggestions-list"></ul>
    </section>
  </main>
  <script src="src/app.js"></script>
  <script src="src/api.js"></script>
</body>
</html>

        <button type="button" id="export-json">Export JSON</button>
    <input type="file" id="import-json" accept=".json">
